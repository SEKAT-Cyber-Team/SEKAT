services:
  backend:
    build: ./backend
    container_name: sekat-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SEKAT_DB_PATH: /data/sekat.db
    volumes:
      - sekat-data:/data
    ports:
      - "8000:8000"
    networks: [sekat-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  dashboard:
    build: ./dashboard
    container_name: sekat-dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks: [sekat-internal]
volumes:
  sekat-data:
networks:
  sekat-internal:
    driver: bridge
